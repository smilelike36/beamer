name: Prepare separate source branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish separate source branches
        run: |
          set -euo pipefail
          echo 'ba765f978593a52ddeb38c450dfe6dde1640e1f9559604272a7f2609dd48d5f6  russian-split.patch' | sha256sum -c -
          echo 'a5607ff47de6fa8fbd777dfe9dc62790529aae802a44dbeec5bd72b91f2a51b7  layout-split.patch' | sha256sum -c -
          cp russian-split.patch layout-split.patch "$RUNNER_TEMP/"
          git config user.name 'smilelike36'
          git config user.email '89850871+smilelike36@users.noreply.github.com'
          git fetch https://github.com/kalkman-code/beamer.git b3fcad8b811725c96d420c1dd86868289775396d
          git checkout --detach FETCH_HEAD
          git am "$RUNNER_TEMP/russian-split.patch"
          test "$(git rev-parse HEAD^{tree})" = 20767153801ad419000705333736da9a1f617e6e
          git push origin HEAD:refs/heads/split/russian-localisation
          git checkout --detach b3fcad8b811725c96d420c1dd86868289775396d
          git am "$RUNNER_TEMP/layout-split.patch"
          test "$(git rev-parse HEAD^{tree})" = aa0bc1b9f6cd5d98eaf1f3da0e824013a9406f79
          git push origin HEAD:refs/heads/split/layout-sync
